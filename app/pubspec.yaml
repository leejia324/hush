name: hush
description: 초대 전용 비밀 채팅 macOS 앱
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  local_auth: ^3.0.2
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: true

  assets:
    - assets/fonts/d2coding/OFL.txt

  fonts:
    - family: D2Coding
      fonts:
        - asset: assets/fonts/d2coding/D2Coding-Ver1.4.0-20261003.ttf
        - asset: assets/fonts/d2coding/D2CodingBold-Ver1.4.0-20261003.ttf
          weight: 700
