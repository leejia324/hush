name: app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

defaults:
  run:
    working-directory: app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # tray_manager가 쓰는 cnativeapi는 테스트할 때도 호스트(Linux)용 네이티브 코드를 빌드한다
      - name: Linux 네이티브 빌드 패키지 설치
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
